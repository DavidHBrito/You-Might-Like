<!DOCTYPE html>
<html> 
<head>
    <title>What do you like?</title>
    <style>
        /* This is your CSS area */
        :root {
            --bg-color: #1e1e2e;
            --txt-color: #cdd6f4;
            --accent: #b4befe;
            --crust: #11111b;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--txt-color);
            font-family: sans-serif;
            padding: 20px;
        }

        #artistList {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- This is the visible area of your site -->
    <h1>Artist Explorer</h1>
    <p id="statusText">Type an artist to see recommendations.</p>
    
    <input type="text" id="artistInput" placeholder="Type an artist...">
    <button onclick="startSearch()">Search</button>

    <ul id="artistList">
        <!-- This is where the names will appear -->
    </ul>

    <script>
        // Now the script is outside the style tags, so it will work!
        async function startSearch() {
            const artist = document.getElementById('artistInput').value;
            const list = document.getElementById('artistList');
            const status = document.getElementById('statusText');

            if (!artist) {
                alert("Please type a name first!");
                return;
            }

            status.innerText = `Since you like ${artist}, you might like:`;
            
            // For now, this just clears the list and adds the name you typed.
            // We will add the "Loop" for the API data here next.
            list.innerHTML = `<li>Searching for similar artists to ${artist}...</li>`; 
        }
    </script>

</body>
</html>
