<!DOCTYPE html>
<html> 
<head>
    <title>What do you like?</title>
    <style>
        /* This is your CSS area */
        :root {
            --bg-color: #1e1e2e;
            --txt-color: #cdd6f4;
            --accent: #b4befe;
            --crust: #11111b;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--txt-color);
            font-family: sans-serif;
            padding: 20px;
        }

        #artistList {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- This is the visible area of your site -->
    <h1>Artist Explorer</h1>
    <p id="statusText">Type an artist to see recommendations.</p>
    
    <input type="text" id="artistInput" placeholder="Type an artist...">
    <button onclick="startSearch()">Search</button>

    <ul id="artistList">
        <!-- This is where the names will appear -->
    </ul>

    <script>
async function startSearch() {
    const artistInput = document.getElementById('artistInput').value;
    const list = document.getElementById('artistList');
    const status = document.getElementById('statusText');
    const apiKey = '993d3f78507ee55155a89495b09def30'; // <--- Paste your Last.fm API Key here!

    if (!artistInput) return;

    status.innerText = `Searching for artists similar to ${artistInput}...`;
    list.innerHTML = ""; // Clear the list for new results

    // 1. The "Order": Tell the API what we want
    const url = `https://ws.audioscrobbler.com/2.0/?method=artist.getsimilar&artist=${encodeURIComponent(artistInput)}&api_key=${apiKey}&format=json`;

    try {
        // 2. The "Fetch": Go get the data
        const response = await fetch(url);
        const data = await response.json();

        // 3. The "Check": Did Last.fm find the artist?
        if (data.similarartists && data.similarartists.artist) {
            const results = data.similarartists.artist;
            
            status.innerText = `Since you like ${artistInput}, you might like:`;

            // 4. The "Loop": For every artist found, create a list item
            results.slice(0, 10).forEach(artist => { // We'll just take the top 10 for now
                const li = document.createElement('li');
                li.innerText = artist.name;
                list.appendChild(li);
            });
        } else {
            status.innerText = "Sorry, couldn't find that artist.";
        }

    } catch (error) {
        console.error("API Error:", error);
        status.innerText = "Oops! Something went wrong with the search.";
    }
}
    </script>

</body>
</html>
